---
# tasks file for local.maj.opnsense.haproxy
#
# Object types are managed in dependency order:
#   ACLs → CPUs → Errorfiles → Healthchecks → Lua → Servers → Users → Groups
#   → Backends → Actions → Frontends
#
# Each task file only runs when the corresponding variable dict is non-empty.

- name: Include ACL management tasks
  ansible.builtin.include_tasks: manage_acls.yml

- name: Include CPU affinity management tasks
  ansible.builtin.include_tasks: manage_cpus.yml

- name: Include errorfile management tasks
  ansible.builtin.include_tasks: manage_errorfiles.yml

- name: Include healthcheck management tasks
  ansible.builtin.include_tasks: manage_healthchecks.yml

- name: Include Lua script management tasks
  ansible.builtin.include_tasks: manage_luas.yml

- name: Include server management tasks
  ansible.builtin.include_tasks: manage_servers.yml

- name: Include user management tasks
  ansible.builtin.include_tasks: manage_users.yml

- name: Include group management tasks
  ansible.builtin.include_tasks: manage_groups.yml

- name: Include backend management tasks
  ansible.builtin.include_tasks: manage_backends.yml

- name: Include action management tasks
  ansible.builtin.include_tasks: manage_actions.yml

- name: Include frontend management tasks
  ansible.builtin.include_tasks: manage_frontends.yml
