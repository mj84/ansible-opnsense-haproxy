---
# Manage HAProxy actions
- name: Manage opnsense haproxy actions
  local.maj.opnsense_haproxy_action:
    api_url: "{{ opnsense_api_url }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    api_ssl_verify: "{{ opnsense_api_ssl_verify | default(false) }}"
    haproxy_reload: "{{ opnsense_haproxy_reload | default(false) }}"
  loop: "{{ opnsense_haproxy_actions | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: opnsense_haproxy_actions | default({}) | length > 0
