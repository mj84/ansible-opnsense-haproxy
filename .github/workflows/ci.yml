---
name: CI

on:
  push:
    branches: [master, main, refactor-modernize]
  pull_request:
    branches: [master, main, refactor-modernize]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ansible-lint flake8 pytest

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run flake8
        run: flake8 library/ module_utils/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ansible-core pytest requests pyyaml

      - name: Run pytest
        run: pytest tests/unit/ -v

  e2e:
    name: End-to-End (mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The role's modules run on the controller in these tests, so the test
      # interpreter needs requests as well as ansible-core.
      - name: Install dependencies
        run: pip install ansible-core requests pytest

      - name: Run pytest against the mock OPNsense API
        run: pytest tests/e2e/ -v
